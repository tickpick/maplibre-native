name: tickpick-release

# Builds the iOS dynamic xcframework + Android opengl-release AAR from this
# fork's combined-feature-state branch and publishes them to:
#  1. A GitHub Release in this repository (both platforms)
#  2. GitHub Packages Maven repo at this repo (Android, for Gradle consumers)
#  3. tickpick/maplibre-gl-native-distribution (iOS, via repository_dispatch)
#
# Consumed by the TickPick mobile app via:
#  - ios/Podfile: $MLRN_NATIVE_VERSION + $MLRN_SPM_SPEC overrides
#  - android/build.gradle: dependency substitution to our coordinate

on:
  workflow_dispatch:
    inputs:
      tickpick_revision:
        type: string
        default: '1'
        description: 'Rev counter (1, 2, ...). Final versions become <upstream>-tickpick.<rev>.'

permissions:
  contents: write
  packages: write

jobs:
  ios-build:
    runs-on: macos-14
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream }}
      tickpick_version: ${{ steps.version.outputs.tickpick }}
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Compute iOS versions
        id: version
        run: |
          upstream=$(cat VERSION)
          tickpick="${upstream}-tickpick.${{ github.event.inputs.tickpick_revision }}"
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          echo "tickpick=${tickpick}" >> "$GITHUB_OUTPUT"
          echo "::notice::iOS upstream=${upstream}, tickpick=${tickpick}"

      - name: Build XCFramework (Dynamic, Metal)
        run: |
          bazel build --compilation_mode=opt --features=dead_strip,thin_lto --objc_enable_binary_stripping \
            --apple_generate_dsym --output_groups=+dsyms --//:renderer=metal //platform/ios:MapLibre.dynamic \
            --embed_label=tickpick_maplibre_ios_${{ steps.version.outputs.tickpick }}
          echo xcframework="$(bazel info execution_root)"/"$(bazel cquery --output=files --compilation_mode=opt --//:renderer=metal //platform/ios:MapLibre.dynamic)" >> "$GITHUB_ENV"

      - name: Package dSYMs
        working-directory: ./bazel-bin/platform/ios/MapLibre.dynamic_dsyms
        run: |
          zip MapLibre_ios_device.framework.dSYM.zip \
            MapLibre_ios_device.framework.dSYM/Contents/Resources/DWARF/MapLibre_ios_device \
            MapLibre_ios_device.framework.dSYM/Contents/Info.plist
          echo dsym_path="$(realpath MapLibre_ios_device.framework.dSYM.zip)" >> "$GITHUB_ENV"

      - name: Stage xcframework + LICENSE
        working-directory: .
        run: |
          cp "${{ env.xcframework }}" MapLibre.dynamic.xcframework.zip
          chmod +w MapLibre.dynamic.xcframework.zip
          zip MapLibre.dynamic.xcframework.zip LICENSE.md
          cp "${{ env.dsym_path }}" .

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ios-artifacts
          path: |
            MapLibre.dynamic.xcframework.zip
            MapLibre_ios_device.framework.dSYM.zip
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream }}
      tickpick_version: ${{ steps.version.outputs.tickpick }}
    defaults:
      run:
        working-directory: platform/android
        shell: bash
    env:
      BUILDTYPE: Release
      RENDERER: opengl
      IS_LOCAL_DEVELOPMENT: false
      MLN_ANDROID_STL: c++_static
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-android-ci

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4
        with:
          node-version-file: ".nvmrc"

      - name: npm install
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Generate Android style code
        run: node platform/android/scripts/generate-style-code.mjs
        working-directory: .

      - name: Compute Android versions
        id: version
        run: |
          upstream=$(cat VERSION)
          tickpick="${upstream}-tickpick.${{ github.event.inputs.tickpick_revision }}"
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          echo "tickpick=${tickpick}" >> "$GITHUB_OUTPUT"
          echo "::notice::Android upstream=${upstream}, tickpick=${tickpick}"

      - name: Disable sccache S3 push (no AWS in fork)
        run: |
          echo SCCACHE_BUCKET=maplibre-native-sccache >> "$GITHUB_ENV"
          echo SCCACHE_REGION=eu-central-1 >> "$GITHUB_ENV"
          echo SCCACHE_S3_NO_CREDENTIALS=1 >> "$GITHUB_ENV"

      - name: Set Gradle version override
        run: |
          # ORG_GRADLE_PROJECT_<name> is read by Gradle as project property
          # `<name>`. maplibre.artifact-settings.gradle.kts honors
          # `mapLibreVersionOverride` to set the artifact version, used as
          # the Maven version on GitHub Packages.
          echo "ORG_GRADLE_PROJECT_mapLibreVersionOverride=${{ steps.version.outputs.tickpick }}" >> "$GITHUB_ENV"

      - name: Build apackage (opengl, Release, all ABIs)
        run: make apackage

      - name: Publish AAR to GitHub Packages
        run: |
          ./gradlew :MapLibreAndroid:publishOpenglreleasePublicationToGitHubPackagesRepository --info --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release files
        working-directory: .
        run: |
          mkdir -p release-staging
          aar_src="platform/android/MapLibreAndroid/build/outputs/aar/MapLibreAndroid-opengl-release.aar"
          if [ ! -f "$aar_src" ]; then
            echo "::error::Expected AAR not found at $aar_src"
            ls -la platform/android/MapLibreAndroid/build/outputs/aar/ || true
            exit 1
          fi
          cp "$aar_src" release-staging/MapLibreAndroid-opengl-release.aar
          for f in platform/android/build/debug-symbols-opengl-*.tar.gz; do
            [ -e "$f" ] && cp "$f" release-staging/ || true
          done

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: android-artifacts
          path: release-staging/*
          if-no-files-found: error

  release:
    needs: [ios-build, android-build]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Compute release tag
        id: tag
        run: |
          # Tag includes both platform versions for traceability. Most
          # consumers pin against the SPM tag (iOS) or Maven coordinate
          # (Android), not the maplibre-native release tag itself, but
          # we keep a stable string here as the source-of-truth artifact
          # location.
          tag="tickpick-${{ needs.ios-build.outputs.tickpick_version }}-android-${{ needs.android-build.outputs.tickpick_version }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            TickPick fork of MapLibre Native with feature-state APIs.

            Combines:
            - iOS:     maplibre/maplibre-native#3858 (feature-state on `MLNMapView`)
            - Android: maplibre/maplibre-native#4219 (feature-state on GeoJsonSource / VectorSource)

            Distributable versions:
            - iOS SPM:        `${{ needs.ios-build.outputs.tickpick_version }}` via tickpick/maplibre-gl-native-distribution
            - Android Maven:  `org.maplibre.gl:android-sdk-opengl:${{ needs.android-build.outputs.tickpick_version }}` via GitHub Packages

            Build SHA: `${{ github.sha }}`
          files: |
            dist/ios-artifacts/MapLibre.dynamic.xcframework.zip
            dist/ios-artifacts/MapLibre_ios_device.framework.dSYM.zip
            dist/android-artifacts/MapLibreAndroid-opengl-release.aar
            dist/android-artifacts/debug-symbols-opengl-*.tar.gz

      - name: Dispatch SPM update (auto, if PAT available)
        # Cross-repo dispatch needs a PAT — the default GITHUB_TOKEN only has
        # access to this repo. If TICKPICK_BOT_PAT is unset, this step skips
        # cleanly; trigger update-spm.yml manually in that case.
        env:
          TICKPICK_BOT_PAT: ${{ secrets.TICKPICK_BOT_PAT }}
        run: |
          if [ -z "$TICKPICK_BOT_PAT" ]; then
            cat <<EOF
            ::warning::secrets.TICKPICK_BOT_PAT is unset. Skipping auto-dispatch
            of update-spm.yml in tickpick/maplibre-gl-native-distribution.

            Trigger manually:
              gh workflow run update-spm.yml \\
                --repo tickpick/maplibre-gl-native-distribution \\
                -f release_tag='${{ steps.tag.outputs.tag }}' \\
                -f version='${{ needs.ios-build.outputs.tickpick_version }}'
          EOF
            exit 0
          fi
          curl -fL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TICKPICK_BOT_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tickpick/maplibre-gl-native-distribution/dispatches \
            -d "$(cat <<EOF
          {
            "event_type": "maplibre-native-released",
            "client_payload": {
              "release_tag": "${{ steps.tag.outputs.tag }}",
              "version": "${{ needs.ios-build.outputs.tickpick_version }}"
            }
          }
          EOF
          )"
          echo "::notice::Dispatched maplibre-native-released to update-spm.yml"
